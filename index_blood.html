<!DOCTYPE html>
<html>
<head>
<title>Blood Donor Registration</title>
<style>
   body {
        font-family: Arial, sans-serif;
        background-color: white;
        margin: 0;
        padding: 20px; }
        .container {
            width: 90%;
            max-width: 750px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 8px; }
        h1 {
            text-align: center;
            color: goldenrod; }
        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
            font-weight: bold; }

        input, select {
            width: 100%;
            padding: 9px;
            box-sizing: border-box;
            border: 1px solid gray;
            border-radius: 4px; }

        .radio-group input,
        .agree-group input {
            width: auto;}
        .radio-group label,
        .agree-group label {
            display: inline;
            font-weight: normal;
            margin-right: 15px; }
        .error {
            color: red;
            font-size: 13px;
            margin-top: 4px; }
        button {
            background-color: green;
            color: white;
            border: none;
            padding: 10px 16px;
            margin-top: 18px;
            border-radius: 4px;
            cursor: pointer;}
        button:hover {
            background-color: red; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px; }
        th, td {
         border: 1px solid #999;
        padding: 9px;
        text-align: left;
}
         th {
            background-color: green;
            color: white; }

        .remove-btn {
            margin: 0;
            padding: 6px 10px;
            background-color: grey; }
    </style>
</head>

<body>
    <div class="container">
        <h1>Blood Donor Registration</h1>
        
        <form id="regForm" method="post" action="#" novalidate onsubmit="return validateForm()">

            <label for="fname">Full Name</label>
            <input type="text" id="fname" name="fname" required minlength="3">
            <p class="error" id="err-fname"></p>

            <label for="sid">AIUB ID</label>
            <input type="text" id="sid" name="sid" required pattern="[0-9]{2}-[0-9]{5}-[0-9]">
            <p class="error" id="err-sid"></p>

            <label for="phone">Mobile</label>
            <input type="text" id="phone" name="phone" required pattern="[0-9]{11}">
            <p class="error" id="err-phone"></p>

            <label for="age">Age</label>
            <input type="number" id="age" name="age" required min="18" max="60">
            <p class="error" id="err-age"></p>

            <label for="bgroup">Blood Group</label>
            <select id="bgroup" name="bgroup" required>
                <option value="">Select blood group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>
            <p class="error" id="err-bgroup"></p>

            <label>Donated before?</label>
            <div class="radio-group">
                <input type="radio" id="donated-yes" name="donated" value="Yes" required>
                <label for="donated-yes">Yes</label>
                <input type="radio" id="donated-no" name="donated" value="No" required>
                <label for="donated-no">No</label>
            </div>
            <p class="error" id="err-donated"></p>
            <div class="agree-group">
            <input type="checkbox" id="agree" name="agree" required>
            <label for="agree">I am healthy and willing to donate</label>
            </div>
            <p class="error" id="err-agree"></p>

            <label for="pass">Password</label>
            <input type="password" id="pass" name="pass" required minlength="6">
            <p class="error" id="err-pass"></p>

            <label for="pass2">Confirm Password</label>
            <input type="password" id="pass2" name="pass2" required>
            <p class="error" id="err-pass2"></p>

            <button type="submit">Register Donor</button>
        </form>
        <p id="count">Total donors: 0</p>

        <table id="list">
            <thead>
                <tr>
                 <th>Name</th>
                 <th>ID</th>
                 <th>Blood Group</th>
                 <th>Action</th>
                </tr>
            </thead>
            <tbody id="donorBody"></tbody>
        </table>
    </div>

    <script>
        let donors = [];

        function validateForm() {
            let name = document.getElementById("fname").value.trim();
            let id = document.getElementById("sid").value;
            let phone = document.getElementById("phone").value;
            let age = document.getElementById("age").value;
            let group = document.getElementById("bgroup").value;
            let password = document.getElementById("pass").value;
            let confirmPassword = document.getElementById("pass2").value;

            document.getElementById("err-fname").innerHTML = "";
            document.getElementById("err-sid").innerHTML = "";
            document.getElementById("err-phone").innerHTML = "";
            document.getElementById("err-age").innerHTML = "";
            document.getElementById("err-bgroup").innerHTML = "";
            document.getElementById("err-donated").innerHTML = "";
            document.getElementById("err-agree").innerHTML = "";
            document.getElementById("err-pass").innerHTML = "";
            document.getElementById("err-pass2").innerHTML = "";

            let valid = true;

            if (name.length < 3) {
                document.getElementById("err-fname").innerHTML = "Name must contain at least 3 characters.";
                valid = false;
            }
            let idPattern = /^[0-9]{2}-[0-9]{5}-[0-9]$/;
            if (!idPattern.test(id)) {
                document.getElementById("err-sid").innerHTML = "Enter ID in the format 22-12345-1.";
                valid = false;
            }
            let phonePattern = /^[0-9]{11}$/;
            if (!phonePattern.test(phone)) {
                document.getElementById("err-phone").innerHTML = "Mobile number must contain exactly 11 digits.";
                valid = false;
            }
            let ageNumber = Number(age);
            if (age === "" || ageNumber < 18 || ageNumber > 60) {
                document.getElementById("err-age").innerHTML = "Age must be between 18 and 60.";
                valid = false;
            }
            if (group === "") {
                document.getElementById("err-bgroup").innerHTML = "Please select a blood group.";
                valid = false;
            }
            let donated = document.querySelector('input[name="donated"]:checked');
            if (donated === null) {
                document.getElementById("err-donated").innerHTML = "Please select Yes or No.";
                valid = false; }
            if (!document.getElementById("agree").checked) {
                document.getElementById("err-agree").innerHTML = "Please confirm that you are healthy and willing to donate.";
                valid = false; }

            if (password.length < 6) {
                document.getElementById("err-pass").innerHTML = "Password must contain at least 6 characters.";
                valid = false; }
            if (confirmPassword === "") {
                document.getElementById("err-pass2").innerHTML = "Please confirm your password.";
                valid = false; }
                 else if (confirmPassword !== password) {
                document.getElementById("err-pass2").innerHTML = "Passwords do not match.";
                valid = false; }
           
                if (valid) {
                let donor = {
                    name: name,
                    id: id,
                    group: group };
                donors.push(donor);
                addRow(donor, donors.length - 1);
                document.getElementById("count").innerHTML = "Total donors: " + donors.length;
                document.getElementById("regForm").reset();
            }
            return false;
        }
        
function addRow(donor, index) {

    let tbody = document.getElementById("donorBody");
    let row = document.createElement("tr");

    let nameCell = document.createElement("td");
    nameCell.innerHTML = donor.name;

    let idCell = document.createElement("td");
    idCell.innerHTML = donor.id;

    let groupCell = document.createElement("td");
    groupCell.innerHTML = donor.group;

    let actionCell = document.createElement("td");

    let removeButton = document.createElement("button");
    removeButton.innerHTML = "Remove";
    removeButton.type = "button";
    removeButton.className = "remove-btn";

    removeButton.onclick = function() {
        removeDonor(index);
    };
    actionCell.appendChild(removeButton);
    row.appendChild(nameCell);
    row.appendChild(idCell);
    row.appendChild(groupCell);
    row.appendChild(actionCell);
    tbody.appendChild(row);
}
        function removeDonor(index) {
            donors.splice(index, 1);
            refreshTable(); }
        function refreshTable() {
            let tbody = document.getElementById("donorBody");
            tbody.innerHTML = "";
              for (let i = 0; i < donors.length; i++) {
                addRow(donors[i], i); }
      document.getElementById("count").innerHTML = "Total donors: " + donors.length; }
    </script>
</body>
</html>
